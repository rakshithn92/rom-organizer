# -Xmx4G / MaxMetaspaceSize 1G fits standard 8 GB GitHub Actions runners; the previous
# -Xmx8G / 4G combination risked the daemon being OOM-killed on CI.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
# TODO: revisit removing these two opt-outs; they exist to keep the AGP 9.x DSL/embedded-Kotlin
# path disabled, and dropping them without a full local Gradle build to verify is unsafe.
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
